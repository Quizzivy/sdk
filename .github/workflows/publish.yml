name: Publish

# Publishes sdk/ as @quizzivy/sdk to GitHub Packages (D-080, D-081, D-082).
# The package is what `make gen` committed; CI proved it matches api/, so
# nothing is regenerated here.
#
#   develop push that changes api/   <x.y.z+1>-dev.<UTC yyyymmddHHMM>.g<sha>  under `next`
#   tag vX.Y.Z (pushed by the owner)  X.Y.Z                                   under `next`
#
# Nothing here publishes under `latest`: promote.yml moves a release there
# once the API that serves it is live (D-081). Publishing is idempotent: a
# version already in the registry is left as it is, and a -dev version is
# stamped with its commit's time, so a re-run names the same version. A
# release whose contract is the same as `latest` is not published (D-080):
# clients keep the version they pin.
on:
  push:
    branches: [develop]
    tags: ["v*"]
    paths:
      - api/**
      - sdk/**

permissions:
  contents: read

concurrency:
  group: sdk-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  OASDIFF_VERSION: v1.33.0
  PACKAGE: "@quizzivy/sdk"

jobs:
  publish:
    name: Publish
    # The @quizzivy scope belongs to the Quizzivy org: skip anywhere else (a fork).
    if: github.repository_owner == 'Quizzivy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # No credentials left in git config: a later step runs a tool fetched at
      # run time, and the job's token can write packages.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: "@quizzivy"

      - name: Decide the version
        id: version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release=$(node -p "require('./sdk/package.json').version")
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$release" ]; then
              echo "::error title=Publish::the tag $REF_NAME does not match sdk/package.json's version $release (info.version in api/openapi.yaml)."
              exit 1
            fi
            version=$release
          else
            IFS=. read -r major minor patch <<< "$release"
            stamp=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M HEAD)
            # The g keeps an all-digit short sha from reading as a number,
            # which semver refuses with a leading zero.
            version="$major.$minor.$((patch + 1))-dev.$stamp.g$(git rev-parse --short=7 HEAD)"
          fi
          if npm view "$PACKAGE@$version" version >/dev/null 2>&1; then
            echo "$PACKAGE@$version is already published; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest=$(npm view "$PACKAGE" dist-tags.latest 2>/dev/null || true)
          if [ "$REF_TYPE" = tag ] && [ -n "$latest" ]; then
            mkdir -p "$RUNNER_TEMP/latest"
            npm pack "$PACKAGE@$latest" --pack-destination "$RUNNER_TEMP/latest" >/dev/null
            tar -xzf "$RUNNER_TEMP"/latest/*.tgz -C "$RUNNER_TEMP/latest"
            # info.version always differs between two releases, so compare the rest.
            if node -e '
              const read = (p) => { const d = JSON.parse(require("fs").readFileSync(p, "utf8")); delete d.info.version; return JSON.stringify(d); };
              process.exit(read(process.argv[1]) === read(process.argv[2]) ? 0 : 1);
            ' "$RUNNER_TEMP/latest/package/openapi.json" sdk/openapi.json; then
              echo "The contract is the same as $PACKAGE@$latest; nothing to publish. api and web keep pinning $latest." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        if: steps.version.outputs.version != '' && steps.version.outputs.latest != ''
        with:
          go-version: "1.27"
          cache: false

      - name: Fetch the SDK production serves
        if: steps.version.outputs.version != '' && steps.version.outputs.latest != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          [ -d "$RUNNER_TEMP/latest/package" ] && exit 0
          mkdir -p "$RUNNER_TEMP/latest"
          npm pack "$PACKAGE@$LATEST" --pack-destination "$RUNNER_TEMP/latest" >/dev/null
          tar -xzf "$RUNNER_TEMP"/latest/*.tgz -C "$RUNNER_TEMP/latest"

      # No token in this step: it runs a tool fetched at run time.
      - name: Changelog since the SDK production serves
        if: steps.version.outputs.version != '' && steps.version.outputs.latest != ''
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          {
            echo "## Contract changes since $PACKAGE@$LATEST"
            echo
            go run "github.com/oasdiff/oasdiff@$OASDIFF_VERSION" changelog \
              "$RUNNER_TEMP/latest/package/openapi.yaml" api/openapi.yaml --format markdown
          } >> "$GITHUB_STEP_SUMMARY" || echo "::warning::the changelog could not be written"

      # --tag next on every publish: npm would otherwise move `latest` to the
      # first version a registry sees, before any API serves it.
      - name: Publish
        if: steps.version.outputs.version != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: sdk
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          npm publish --tag next
          echo "Published $PACKAGE@$VERSION under \`next\`." | tee -a "$GITHUB_STEP_SUMMARY"
